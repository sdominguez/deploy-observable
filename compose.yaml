services:
  api-v1:
    build: ./app
    environment:
      APP_VERSION: v1
      FAILURE_RATE: '0.00'
      SLOW_RATE: '0.00'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  api-v2:
    build: ./app
    environment:
      APP_VERSION: v2
      FAILURE_RATE: '0.20'
      SLOW_RATE: '0.40'
      SLOW_SECONDS: '0.8'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-v1:
        condition: service_healthy
      api-v2:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    depends_on: [api-v1, api-v2]
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
